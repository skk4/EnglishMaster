<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EnglishMaster · 词汇 - HTML 原型</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
  <header class="bg-white border-b border-gray-200 px-6 py-3 flex items-center gap-3">
    <a href="#" class="rounded-lg p-2 hover:bg-gray-100">←</a>
    <h1 class="font-semibold text-gray-900">词汇练习</h1>
    <div class="ml-auto flex gap-2">
      <button class="rounded-lg px-3 py-1.5 text-sm bg-blue-600 text-white">上册</button>
      <button class="rounded-lg px-3 py-1.5 text-sm bg-gray-100 text-gray-700">下册</button>
    </div>
  </header>

  <main class="max-w-2xl mx-auto px-6 py-8">
    <div class="text-sm text-gray-500 text-center mb-4">第 1 / 10 个</div>

    <div class="bg-white rounded-2xl shadow-sm border-2 border-gray-200 min-h-[320px] p-8 flex flex-col items-center justify-center cursor-pointer hover:border-blue-300">
      <h2 class="text-5xl font-bold text-gray-900 mb-3 text-center">camp</h2>
      <p class="text-gray-500 text-lg mb-4">/kæmp/</p>
      <button class="rounded-full p-2 hover:bg-gray-100">🔊</button>
      <p class="text-xs text-gray-400 mt-6">点击卡片查看释义</p>
    </div>

    <div class="grid grid-cols-2 gap-3 mt-6">
      <button class="rounded-xl border-2 border-red-200 text-red-700 py-3 hover:bg-red-50">✗ 不认识</button>
      <button class="rounded-xl border-2 border-green-200 text-green-700 py-3 hover:bg-green-50">✓ 认识了</button>
    </div>

    <div class="mt-4 text-center">
      <button class="text-sm text-gray-500 hover:text-gray-700">↻ 换一批</button>
    </div>
  </main>
</body>
</html>
