<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EnglishMaster · 聊天 - HTML 原型</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
  <div class="flex h-screen">
    <!-- Sidebar -->
    <aside class="w-64 bg-white border-r border-gray-200 flex flex-col">
      <div class="px-4 py-4 border-b border-gray-200 flex items-center gap-2">
        <div class="w-7 h-7 rounded-full bg-blue-600 text-white text-xs flex items-center justify-center font-medium">A</div>
        <div class="flex-1 min-w-0">
          <div class="text-sm font-medium text-gray-900 truncate">Alice</div>
        </div>
        <button class="rounded p-1 hover:bg-gray-100" title="退出">⏻</button>
      </div>

      <div class="flex-1 overflow-y-auto p-3">
        <div class="text-xs text-gray-500 uppercase tracking-wide mb-2 px-2">模式</div>
        <div class="space-y-1">
          <button class="w-full text-left rounded-lg px-3 py-2 bg-blue-50 text-blue-700">
            <div class="text-sm font-medium">通用问答</div>
            <div class="text-xs text-gray-500 mt-0.5">日常学习问题</div>
          </button>
          <button class="w-full text-left rounded-lg px-3 py-2 text-gray-700 hover:bg-gray-100">
            <div class="text-sm font-medium">语法讲解</div>
            <div class="text-xs text-gray-500 mt-0.5">详细解释语法点</div>
          </button>
          <button class="w-full text-left rounded-lg px-3 py-2 text-gray-700 hover:bg-gray-100">
            <div class="text-sm font-medium">出题练习</div>
          </button>
          <button class="w-full text-left rounded-lg px-3 py-2 text-gray-700 hover:bg-gray-100">
            <div class="text-sm font-medium">对话练习</div>
          </button>
        </div>

        <div class="mt-4 pt-4 border-t border-gray-200">
          <div class="flex items-center justify-between mb-2 px-2">
            <div class="text-xs text-gray-500 uppercase tracking-wide">对话历史</div>
            <button class="rounded p-1 hover:bg-gray-100" title="新建">+</button>
          </div>
          <div class="space-y-1">
            <div class="flex items-center gap-2 rounded-lg px-3 py-2 cursor-pointer bg-blue-50 text-blue-700">
              <span class="text-xs">💬</span>
              <div class="flex-1 min-w-0 text-sm truncate">什么是过去完成时？</div>
            </div>
            <div class="flex items-center gap-2 rounded-lg px-3 py-2 cursor-pointer text-gray-700 hover:bg-gray-100">
              <span class="text-xs">💬</span>
              <div class="flex-1 min-w-0 text-sm truncate">讲讲 Unit 1 词汇</div>
            </div>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main -->
    <main class="flex-1 flex flex-col">
      <header class="bg-white border-b border-gray-200 px-6 py-3 flex items-center gap-2">
        <span class="text-blue-600">📖</span>
        <h2 class="font-medium text-gray-900 truncate">什么是过去完成时？</h2>
        <span class="text-xs text-gray-400 ml-2">语法讲解</span>
      </header>

      <div class="flex-1 overflow-y-auto px-6 py-6">
        <div class="max-w-3xl mx-auto space-y-4">
          <!-- User msg -->
          <div class="flex justify-end">
            <div class="max-w-[80%] rounded-2xl px-4 py-3 bg-blue-600 text-white">
              什么是过去完成时？和过去时有什么区别？
            </div>
          </div>

          <!-- AI msg -->
          <div class="flex justify-start">
            <div class="max-w-[80%]">
              <div class="text-xs text-gray-500 mb-1 px-3 flex items-center gap-1">
                <span>📖</span><span>语法</span>
              </div>
              <div class="rounded-2xl px-4 py-3 bg-gray-100 text-gray-900">
                <p><strong>过去完成时（Past Perfect）</strong>表示<em>过去某一时刻之前</em>已经完成的动作。</p>
                <p class="mt-2"><strong>结构</strong>：had + 过去分词（V-ed）</p>
                <p class="mt-2"><strong>例句</strong>：</p>
                <ul class="list-disc list-inside">
                  <li>I had finished my homework before 8pm. （8 点前我就做完了作业）</li>
                  <li>She had left when I called. （我打电话时她已经走了）</li>
                </ul>
                <p class="mt-2"><strong>vs 过去时</strong>：过去时只描述过去的动作；过去完成时强调"过去的过去"。</p>
              </div>
              <div class="mt-3 pt-3 border-t border-gray-300 text-xs text-gray-600">
                <button class="flex items-center gap-1.5 text-gray-500">📚 教材来源 (3) ▾</button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="border-t border-gray-200 bg-white px-4 py-3">
        <div class="max-w-3xl mx-auto flex items-end gap-2">
          <textarea
            rows="1"
            class="flex-1 resize-none rounded-xl border border-gray-300 px-4 py-2.5 text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500"
            placeholder="输入你的问题，回车发送…"
            style="min-height: 44px"
          ></textarea>
          <button class="rounded-xl bg-blue-600 text-white px-4 py-2.5">发送</button>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
