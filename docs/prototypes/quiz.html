<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EnglishMaster · Quiz - HTML 原型</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
  <header class="bg-white border-b border-gray-200 px-6 py-3 flex items-center gap-3">
    <a href="#" class="rounded-lg p-2 hover:bg-gray-100">←</a>
    <h1 class="font-semibold text-gray-900">随堂测试</h1>
  </header>

  <main class="max-w-3xl mx-auto px-6 py-8">
    <!-- 配置页（开始前） -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6">
      <h2 class="text-lg font-medium text-gray-900 mb-6">选择题库</h2>

      <div class="space-y-5">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">学期</label>
          <div class="flex gap-2">
            <button class="rounded-lg px-4 py-2 text-sm bg-blue-600 text-white">上册</button>
            <button class="rounded-lg px-4 py-2 text-sm bg-gray-100 text-gray-700">下册</button>
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">单元</label>
          <div class="grid grid-cols-5 gap-2">
            <button class="rounded-lg px-3 py-2 text-sm bg-blue-600 text-white">Unit 1</button>
            <button class="rounded-lg px-3 py-2 text-sm bg-gray-100 text-gray-700">Unit 2</button>
            <button class="rounded-lg px-3 py-2 text-sm bg-gray-100 text-gray-700">Unit 3</button>
            <button class="rounded-lg px-3 py-2 text-sm bg-gray-100 text-gray-700">Unit 4</button>
            <button class="rounded-lg px-3 py-2 text-sm bg-gray-100 text-gray-700">Unit 5</button>
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">题型</label>
          <div class="flex gap-2">
            <button class="rounded-lg px-4 py-2 text-sm bg-blue-600 text-white">单选题</button>
            <button class="rounded-lg px-4 py-2 text-sm bg-gray-100 text-gray-700">填空题</button>
            <button class="rounded-lg px-4 py-2 text-sm bg-gray-100 text-gray-700">翻译题</button>
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">题数</label>
          <div class="flex gap-2">
            <button class="rounded-lg px-4 py-2 text-sm bg-blue-600 text-white">3 题</button>
            <button class="rounded-lg px-4 py-2 text-sm bg-gray-100 text-gray-700">5 题</button>
            <button class="rounded-lg px-4 py-2 text-sm bg-gray-100 text-gray-700">10 题</button>
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">难度</label>
          <div class="flex gap-2">
            <button class="rounded-lg px-4 py-2 text-sm bg-gray-100 text-gray-700">简单</button>
            <button class="rounded-lg px-4 py-2 text-sm bg-blue-600 text-white">中等</button>
            <button class="rounded-lg px-4 py-2 text-sm bg-gray-100 text-gray-700">困难</button>
          </div>
        </div>
      </div>

      <button class="w-full mt-8 rounded-lg bg-blue-600 text-white py-3 hover:bg-blue-700">开始测试</button>
    </div>

    <!-- 题目卡片（开始后示意） -->

  </main>
</body>
</html>
