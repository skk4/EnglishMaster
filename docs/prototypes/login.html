<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EnglishMaster · 登录 / 注册 - HTML 原型</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-50 min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-6">
      <div class="inline-flex w-12 h-12 bg-blue-600 text-white rounded-full items-center justify-center text-2xl">🎓</div>
      <h1 class="text-2xl font-bold text-gray-900 mt-3">EnglishMaster</h1>
      <p class="text-sm text-gray-500 mt-1">八年级英语 AI 学习助手</p>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6">
      <div class="flex gap-2 mb-6">
        <button class="flex-1 py-2 rounded-lg text-sm font-medium bg-blue-50 text-blue-700">登录</button>
        <button class="flex-1 py-2 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-50">注册</button>
      </div>

      <form class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">用户名</label>
          <input type="text" class="w-full rounded-lg border border-gray-300 px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="你的用户名" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">密码</label>
          <input type="password" class="w-full rounded-lg border border-gray-300 px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="你的密码" />
        </div>
        <button type="button" class="w-full rounded-lg bg-blue-600 text-white py-2.5 hover:bg-blue-700">登录</button>
      </form>
    </div>

    <p class="text-xs text-center text-gray-400 mt-6">
      登录即同意 <a class="underline" href="#">服务条款</a> 和 <a class="underline" href="#">隐私政策</a>
    </p>
  </div>
</body>
</html>
